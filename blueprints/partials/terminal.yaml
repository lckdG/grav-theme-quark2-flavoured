form:
  fields:

    terminal_title:
      type: spacer
      title: Terminal

    header.terminal.profile:
      type: text
      label: Profile
      placeholder: default

    header.terminal.cwd:
      type: text
      label: Working Directory
      placeholder: '~/projects'

    header.terminal.tabs:
      type: array
      label: Tabs
      value_only: true
      description: The first tab is shown as active.

    header.terminal.branch:
      type: text
      label: Git Branch
      placeholder: main

    header.terminal.whoami:
      type: text
      label: whoami Name
      placeholder: guest

    header.terminal.commands:
      type: array
      label: Commands
      value_only: true
      description: Typed and run on load, in order. Output comes from the terminal commands, e.g. `whoami`, `ls`, `help`.

    header.terminal.pages:
      name: pages
      type: list
      label: Pages
      description: Pages listed by `ls` and reachable with `cd`.

      fields:
        .slug:
          type: text
          label: Slug
        .color:
          type: select
          label: Color
          default: t-green
          options:
            t-red: Red
            t-green: Green
            t-yellow: Yellow
            t-blue: Blue
            t-purple: Purple
            t-aqua: Aqua
            t-orange: Orange
            t-gray: Gray
