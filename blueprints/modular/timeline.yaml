title: Timeline
'@extends': default

form:
  fields:
    tabs:
      fields:
        timeline:
          type: tab
          title: Timeline
          fields:
            header.section_class:
              type: text
              label: Section Class

            header.timeline:
              type: list
              label: Timeline Items

              fields:
                .startdate:
                  type: datetime
                  format: M Y
                  label: Start Date

                .enddate:
                  type: datetime
                  format: M Y
                  label: End Date

                .present:
                  type: toggle
                  label: To Present?
                  options:
                    1: Yes
                    0: No

                .header:
                  type: text
                  label: Header

                .subheader:
                  type: text
                  label: Subheader

                .description:
                  type: text
                  label: Description

