title: Timeline
'@extends': default

form:
  fields:
    tabs:
      fields:
        timeline:
          type: tab
          title: Timeline
          fields:
            header.section_class:
              type: text
              label: Section Class

            header.timeline:
              type: list
              label: Timeline Items

              fields:
                .startdate:
                  type: text
                  label: Start Date

                .enddate:
                  type: text
                  label: End Date

                .present:
                  type: toggle
                  label: To Present?
                  options:
                    1: Yes
                    0: No

                .header:
                  type: text
                  label: Header

                .subheader:
                  type: text
                  label: Subheader

                .level_up:
                  type: toggle
                  label: Level Up Badge
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_ADMIN.YES
                    0: PLUGIN_ADMIN.NO
                  validate:
                    type: bool

                .description:
                  type: text
                  label: Description

                .highlights:
                  type: array
                  label: Highlights
                  value_only: true

            header.education:
              type: list
              label: Education
              description: Shown as cards beside the timeline.

              fields:
                .startdate:
                  type: text
                  label: Start

                .enddate:
                  type: text
                  label: End

                .header:
                  type: text
                  label: Degree

                .subheader:
                  type: text
                  label: School

                .note:
                  type: text
                  label: Note
                  placeholder: honor program

