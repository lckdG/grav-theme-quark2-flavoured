title: Skills
'@extends': default

form:
  fields:
    tabs:
      fields:
        skills:
          type: tab
          title: Skills
          fields:
            header.section_class:
              type: text
              label: Section Class

            header.categories:
              name: categories
              type: list
              label: Categories

              .title:
                name: cat_title
                type: text
                label: Title

              .skills:
                name: skills
                type: list
                label: Skills

                fields:
                  .image:
                    type: filepicker
                    label: Skill Icon
                  .header:
                    type: text
                    label: Header

