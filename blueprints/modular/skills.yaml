title: Skills
'@extends': default

form:
  fields:
    tabs:
      fields:
        skills:
          type: tab
          title: Skills
          fields:
            header.section_class:
              type: text
              label: Section Class

            header.categories:
              name: categories
              type: list
              label: Categories

              fields:
                .title:
                  name: cat_title
                  type: text
                  label: Title

                .rarity:
                  type: select
                  label: Rarity
                  description: Colours the group's bar and title.
                  default: common
                  options:
                    common: Common
                    uncommon: Uncommon
                    rare: Rare
                    epic: Epic
                    legendary: Legendary
                    mythic: Mythic
                    cursed: Cursed

                .skills:
                  name: skills
                  type: list
                  label: Skills

                  fields:
                    .image:
                      type: filepicker
                      label: Skill Icon
                    .header:
                      type: text
                      label: Header

