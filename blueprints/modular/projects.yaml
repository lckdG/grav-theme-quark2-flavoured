title: Projects
'@extends': default

form:
  fields:
    tabs:
      fields:
        projects:
          type: tab
          title: Projects
          fields:
            header.section_class:
              type: text
              label: Section Class

            header.projects:
              name: projects
              type: list
              label: Projects

              fields:
                .image:
                  type: filepicker
                  label: Project Thumbnail
                .header:
                  type: text
                  label: Header
                .featured:
                  type: toggle
                  label: Featured
                  description: Featured projects get a big card. The rest go into the More projects carousel.
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_ADMIN.YES
                    0: PLUGIN_ADMIN.NO
                  validate:
                    type: bool
                .rarity:
                  type: select
                  label: Rarity
                  default: common
                  options:
                    common: Common
                    uncommon: Uncommon
                    rare: Rare
                    epic: Epic
                    legendary: Legendary
                    mythic: Mythic
                    cursed: Cursed
                .genres:
                  type: list
                  label: Genres
                  fields:
                    .text:
                      type: text
                      label: Genre
                .text:
                  type: text
                  label: Description
                .summary:
                  type: text
                  label: Short Description
                  description: Shown on the small cards in the More projects carousel instead of the description.
                .role:
                  type: text
                  label: Role
                .engine:
                  type: text
                  label: Engine
                  placeholder: Unity
                .platforms:
                  type: text
                  label: Platforms
                  placeholder: 'iOS · Android'
                .team:
                  type: number
                  label: Team Size
                  description: 'Shown as a 5-step scale plus the number: up to 5 · 12 · 25 · 60 · more.'
                  validate:
                    type: int
                    min: 1
                .team_approx:
                  type: toggle
                  label: Approximate Team Size
                  description: Shows a ~ before the number, e.g. ~40 people.
                  highlight: 0
                  default: 0
                  options:
                    1: PLUGIN_ADMIN.YES
                    0: PLUGIN_ADMIN.NO
                  validate:
                    type: bool
                .highlights:
                  type: array
                  label: What I Built
                  value_only: true
                .links:
                  type: list
                  label: Links
                  fields:
                    .text:
                      type: text
                      label: Text
                      placeholder: 'store page · soon'
                    .url:
                      type: text
                      label: URL
                      description: Leave blank to show the text as a plain label.
                .tags:
                  type: list
                  label: Tag List
                  fields:
                    .image:
                      type: filepicker
                      label: Tag Icon
                    .title:
                      type: text
                      label: Tag Title
