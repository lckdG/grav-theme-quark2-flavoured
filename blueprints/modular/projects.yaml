title: Projects
'@extends': default

form:
  fields:
    tabs:
      fields:
        projects:
          type: tab
          title: Projects
          fields:
            header.class:
              type: select
              label: Layout
              default: small
              size: medium
              options:
                small: Small
                standard: Standard
                projects: Specific for project showcase

            header.projects:
              name: projects
              type: list
              label: Projects

              fields:
                .url:
                  type: text
                  label: Link
                .image:
                  type: filepicker
                  label: Project Thumbnail
                .header:
                  type: text
                  label: Header
                .text:
                  type: text
                  label: Description
                .role:
                  type: text
                  label: Role
                .tags:
                  type: list
                  label: Tag List
                  fields:
                    .image:
                      type: filepicker
                      label: Tag Icon
                    .title:
                      type: text
                      label: Tag Title
